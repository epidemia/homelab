services:
  gitea:
    container_name: gitea
    image: docker.gitea.com/gitea:${GITEA_VERSION}
    restart: unless-stopped
    environment:
      - USER_UID=${GITEA_UID}
      - USER_GID=${GITEA_GID}
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__ROOT_URL=https://git.${BASE_URL}/
      - GITEA__server__SSH_DOMAIN=git.${BASE_URL}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT}
      - GITEA__repository__FORCE_PRIVATE=true
      - GITEA__repository__DISABLED_REPO_UNITS=repo.issues,repo.ext_issues,repo.pulls,repo.wiki,repo.ext_wiki,repo.projects,repo.packages,repo.actions
      - GITEA__repository__DISABLE_MIGRATIONS=true
      - GITEA__repository__DISABLE_STARS=true
      - GITEA__repository__DISABLE_DOWNLOAD_SOURCE_ARCHIVES=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION=false
      - GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM=false
      - GITEA__service__ENABLE_BASIC_AUTHENTICATION=false
      - GITEA__service__ENABLE_PASSKEY_AUTHENTICATION=false
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      - GITEA__admin__DISABLE_REGULAR_ORG_CREATION=true
      - GITEA__service.explore__DISABLE_ORGANIZATIONS_PAGE=true
      - GITEA__actions__ENABLED=false
      - GITEA__attachment__ENABLED=false
      - GITEA__mirror__ENABLED=false
      - GITEA__oauth2__ENABLED=false
      - GITEA__packages__ENABLED=false
      - GITEA__security__DISABLE_WEBHOOKS=true
      - GITEA__api__ENABLE_SWAGGER=false
      - GITEA__other__ENABLE_FEED=false
      - GITEA__other__ENABLE_SITEMAP=false
    volumes:
      - /srv/docker/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_SSH_PORT}:22"
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${BASE_URL}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "traefik.docker.network=homelab"

networks:
  homelab:
    external: true
